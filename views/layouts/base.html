{{define "base"}}
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{block "title" .}}Default Title{{end}}</title>
    <link rel="stylesheet" href="/app.css" />
</head>

<body class="bg-neutral-50 text-neutral-900">
    <main class="container mx-auto max-w-4xl px-4 py-8">
        {{block "content" .}}{{end}}
    </main>
    <div>
        <h2>upload your files</h2>
    </div>
    <form id="form-upload" method="post">
        <input type="file" multiple id="files" />
        <button type="submit" id="submit-btn">Upload</button>
    </form>
    <footer class="py-8 text-center text-sm text-neutral-500">
        © {{.Year}} MyBlog
    </footer>

    <script>
        const $documents = document.getElementById("files");
        const $btn = document.getElementById("submit-btn");
        const $form = document.getElementById("form-upload");

        const BACKEND_URL = "http://localhost:3000";
        const token = "";
        const CONCURRENCY = 4;
        const MAX_RETRIES = 3;

        async function api(path, body) {
            const res = await fetch(BACKEND_URL + path, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${token}`,
                },
                body: JSON.stringify(body),
            });
            const data = await res.json();

            if (!res.ok) throw new Error(data.message || `request failed (${res.status})`);
            return data;
        }

        async function handleUpload(file) {
            const init = await api("/uploads", {
                file_name: file.name,
                size_bytes: file.size,
                content_type: file.type,
            });

            if (init.mode === "single") {
                const put = await fetch(init.url, {
                    method: init.method,
                    headers: init.headers,
                    body: file,
                });
                if (!put.ok) throw new Error("upload failed");
                return init.upload_id;
            }

            if (init.mode === "multipart") {
                await uploadMultipart(file, init);
                return init.upload_id;
            }

            throw new Error("unknown upload mode");
        }

        async function uploadMultipart(file, {upload_id, part_size, part_count, parts}) {
            const urls = new Map(parts.map((p) => [p.part_number, p.url]));
            const etags = new Map();
            const queue = Array.from({length: part_count}, (_, i) => i + 1);

            async function getUrl(n) {
                if (!urls.has(n)) {
                    const batch = [];
                    for (let i = n; i < n + 5 && i <= part_count; i++)
                        if (!urls.has(i)) batch.push(i);
                    const res = await api(`/uploads/${upload_id}/parts`, {
                        part_numbers: batch,
                    });
                    res.parts.forEach((p) => urls.set(p.part_number, p.url));
                }
                return urls.get(n);
            }

            async function uploadPart(n) {
                const slice = file.slice(
                    (n - 1) * part_size,
                    Math.min(n * part_size, file.size),
                );

                for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
                    const url = await getUrl(n);
                    try {
                        const res = await fetch(url, {method: "PUT", body: slice});
                        if (res.ok) {
                            etags.set(n, res.headers.get("ETag"));
                            return;
                        }
                        if (res.status === 403) urls.delete(n);
                    } catch {
                        // network error, retry
                    }
                }
                throw new Error(`part ${n} failed`);
            }

            async function worker() {
                while (queue.length) {
                    const n = queue.shift();
                    await uploadPart(n);
                }
            }

            await Promise.all(Array.from({length: CONCURRENCY}, worker));

            await api(`/uploads/${upload_id}/complete`, {
                parts: [...etags]
                    .map(([part_number, etag]) => ({part_number, etag}))
                    .sort((a, b) => a.part_number - b.part_number),
            });
        }

        $form.addEventListener("submit", async (e) => {
            e.preventDefault();
            $btn.disabled = true;
            for (const file of $documents.files) {
                try {
                    await handleUpload(file);
                } catch (err) {
                    alert(err);
                }
            }
            $btn.disabled = false;
        });
    </script>
</body>

</html>
{{end}}
