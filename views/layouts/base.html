{{define "base"}}
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{block "title" .}}Default Title{{end}}</title>
    <link rel="stylesheet" href="/app.css" />
</head>

<body class="bg-neutral-50 text-neutral-900">
    <main class="container mx-auto max-w-4xl px-4 py-8">
        {{block "content" .}}{{end}}
    </main>
    <div>
        <h2>upload your files</h2>
    </div>
    <form id="form-upload" method="post">
        <input type="file" multiple id="files" />
        <button type="submit" id="submit-btn">Upload</button>
    </form>
    <footer class="py-8 text-center text-sm text-neutral-500">
        © {{.Year}} MyBlog
    </footer>

    <script>
        const $documents = document.getElementById("files");
        const $btn = document.getElementById("submit-btn");
        const $form = document.getElementById("form-upload");

        $form.addEventListener("submit", async (e) => {
            e.preventDefault();
            $btn.disabled = true;
            for await (const file of $documents.files) {
                try {
                    console.log(file)
                    const result = await handlepresigneFile(file.name, file.size, file.type);
                    await handleUpload(result.upload_id, result.url, result.method, result.headers, file)
                } catch (e) {
                    alert(e)
                }
            }
            $btn.disabled = false;
        });

        const BACKEND_URL = "http://localhost:3000";

        const handlepresigneFile = async function (name, size, type) {
            const request = await fetch(BACKEND_URL + "/uploads", {
                method: "POST",
                body: JSON.stringify({
                    file_name: name,
                    size_bytes: size,
                    content_type: type,
                }),
            });

            console.log(request.status)

            if (request.status !== 200) {
                throw new Error(await request.text());
            }

            const {upload_id, url, method, headers} = await request.json();
            return {upload_id, url, method, headers}
        };

        const handleUpload = async function (upload_id, url, method, headers, file) {
            const put = await fetch(url, {method, headers, body: file});
            if (!put.ok) throw new Error("upload failed");
        }

    </script>
</body>

</html>
{{end}}
