{{define "auth"}}
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>{{block "auth-title" .}}File Upload{{end}}</title>
    <style>
        :root {
            --bg: #f4f6fb;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --danger: #b91c1c;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
                "Helvetica Neue", Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(1100px 550px at 50% -10%, #e0e7ff 0%, transparent 60%),
                radial-gradient(800px 500px at 100% 110%, #dbeafe 0%, transparent 55%),
                var(--bg);
            -webkit-font-smoothing: antialiased;
        }

        .page {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background: var(--card);
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 24px;
            box-shadow:
                0 24px 70px -30px rgba(15, 23, 42, 0.35),
                0 10px 30px -18px rgba(15, 23, 42, 0.18);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
            color: inherit;
            text-decoration: none;
        }

        .logo {
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            flex: none;
            color: #fff;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            box-shadow: 0 10px 22px -10px rgba(99, 102, 241, 0.9);
        }

        .brand-name {
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .sub {
            margin: 0 0 24px;
            font-size: 0.9rem;
            color: var(--muted);
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .field input {
            width: 100%;
            padding: 11px 13px;
            font: inherit;
            font-weight: 400;
            color: var(--text);
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        .field input:focus {
            background: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .btn-primary {
            width: 100%;
            margin-top: 4px;
            padding: 12px 20px;
            font: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
            background: var(--primary);
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 10px 20px -12px rgba(79, 70, 229, 0.9);
            transition: background 0.15s ease;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-hover);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .form-error {
            margin: 0;
            padding: 10px 12px;
            font-size: 0.85rem;
            color: var(--danger);
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 10px;
        }

        .switch {
            margin: 22px 0 0;
            text-align: center;
            font-size: 0.875rem;
            color: var(--muted);
        }

        .switch a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        .switch a:hover {
            text-decoration: underline;
        }

        footer {
            padding: 24px 16px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--muted);
        }
    </style>
</head>

<body>
    <div class="page">
        <main class="card">
            <a class="brand" href="/home">
                <span class="logo" aria-hidden="true">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 16V4" />
                        <path d="m7 9 5-5 5 5" />
                        <path d="M20 16v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2" />
                    </svg>
                </span>
                <span class="brand-name">File Upload</span>
            </a>

            {{block "auth-content" .}}{{end}}
        </main>
    </div>

    <footer>© {{.Year}} File Upload</footer>
</body>

</html>
{{end}}
