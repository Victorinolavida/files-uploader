services:
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_NOTIFY_REDIS_ENABLE_UPLOADS: "on"
      MINIO_NOTIFY_REDIS_ADDRESS_UPLOADS: "redis:6379"
      MINIO_NOTIFY_REDIS_KEY_UPLOADS: "minio:events"
      MINIO_NOTIFY_REDIS_FORMAT_UPLOADS: "access"
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: 6379
    volumes:
      - redisinsight-data:/data

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/files-uploader;
      mc event add local/files-uploader arn:minio:sqs::UPLOADS:redis --event put --prefix quarantine/ || true;
      mc event list local/files-uploader;
      "

volumes:
  minio-data:
  redisinsight-data:
